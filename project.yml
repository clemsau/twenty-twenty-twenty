name: TwentyTwentyTwenty
options:
  bundleIdPrefix: com.clementsauvage
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  TwentyTwentyTwenty:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: "Twenty twenty twenty"
        PRODUCT_BUNDLE_IDENTIFIER: com.clementsauvage.TwentyTwentyTwenty
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/TwentyTwentyTwenty.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES

  TwentyTwentyTwentyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: TwentyTwentyTwenty
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Twenty twenty twenty.app/Contents/MacOS/Twenty twenty twenty"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TwentyTwentyTwenty:
    build:
      targets:
        TwentyTwentyTwenty: all
        TwentyTwentyTwentyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TwentyTwentyTwentyTests
